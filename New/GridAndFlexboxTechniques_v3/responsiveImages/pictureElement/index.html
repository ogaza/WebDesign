<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Responsive images</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <picture>
      <source srcset="img/fem-moons-large.jpg" media="(min-width: 1200px)" />
      <source srcset="img/fem-moons-med.jpg" media="(min-width: 900px)" />
      <source srcset="img/fem-moons-small.jpg" media="(min-width: 600px)" />

      <!-- the default picture  -->
      <img src="img/fem-moons-default.jpg" alt="Io, Europa, Ganymede, and Callisto, showing relative size." />
    </picture>

  <!--
    https://www.responsivebreakpoints.com/
  -->

  </body>
</html>
