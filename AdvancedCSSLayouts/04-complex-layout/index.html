<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://kit.fontawesome.com/fb7f6f30e4.js"></script>
    <link
      href="https://fonts.googleapis.com/css?family=Nobile:400,500|Open+Sans&display=swap"
      rel="stylesheet"
    />
    <!-- <script src="https://kit.fontawesome.com/fb7f6f30e4.js"></script> -->
    <script
      src="https://kit.fontawesome.com/d9edc1cd11.js"
      crossorigin="anonymous"
    ></script>
    <title>04-complex-layout</title>
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/styles-basic.css" />
  </head>
  <body>
    <header>
      <div class="row">
        <a
          href="#main-menu"
          id="main-menu-toggle"
          class="menu-toggle"
          aria-label="Open main menu"
        >
          <span class="sr-only">Open main menu</span>
          <span class="fa fa-bars" aria-hidden="true"></span>
        </a>
        <div class="logo">
          <h1><i class="fas fa-paint-brush"></i> LayOut Times</h1>
          <h2>Your Web Design Destination</h2>
        </div>
      </div>
      <nav id="main-menu" class="main-menu" aria-label="Main menu">
        <a
          href="#main-menu-toggle"
          id="main-menu-close"
          class="menu-close"
          aria-label="Close main menu"
        >
          <span class="sr-only">Close main menu</span>
          <span class="fa fa-close" aria-hidden="true"></span>
        </a>
        <ul>
          <li><a href="#">CSS Resources</a></li>
          <li><a href="#">Design</a></li>
          <li><a href="#">Videos</a></li>
          <li><a href="#">Social Media</a></li>
          <li><a href="#">Inspiration</a></li>
          <li><a href="#">News</a></li>
          <li><a href="#">Top Talent</a></li>
        </ul>
      </nav>
      <a href="#main-menu-toggle" class="backdrop" tabindex="-1" hidden></a>
    </header>

    <main>
      <section id="first">first</section>
      <section id="main">main</section>
      <section id="devs">devs</section>
      <section id="resources">resources</section>
    </main>

    <a href="../" class="a--back">back</a>
  </body>
</html>
